<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Où mène ce lien ? · shortlink</title>
<link rel="stylesheet" href="/style.css">
<script src="/icons.js"></script>
<script src="/ui.js"></script>
</head>
<body>
<main>
  <header class="topbar">
    <a class="brand" href="/">short<span>link</span></a>
    <a class="btn" href="/">Créer un lien court</a>
  </header>

  <h1>Où mène ce lien ?</h1>
  <p class="lead">Vérifie l'adresse de destination avant d'y aller.</p>

  <section class="card" id="card" hidden>
    <p class="muted small" style="margin:0">Ce lien redirige vers</p>
    <p class="warn-host" id="host"></p>
    <p class="muted small" id="full" style="word-break:break-all;margin:0 0 18px"></p>
    <div class="row">
      <a id="go" class="btn primary" href="#">Continuer vers le site<i data-i="arrow-right"></i></a>
      <button id="report" class="ghost danger" type="button"><i data-i="flag"></i>Signaler ce lien</button>
    </div>
  </section>
  <p id="error" class="card notice" role="alert" hidden></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const code = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");

  (async () => {
    try {
      let res;
      try { res = await fetch("/api/preview/" + encodeURIComponent(code)); }
      catch { throw new Error("Serveur injoignable. Vérifie ta connexion."); }
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || "Ce lien est introuvable.");
      $("host").textContent = d.host;
      $("full").textContent = d.url;
      $("go").href = "/" + encodeURIComponent(code);
      $("card").hidden = false;
    } catch (e) {
      $("error").textContent = e.message;
      $("error").hidden = false;
    }
  })();

  $("report").addEventListener("click", async () => {
    const reason = await ask({
      title: "Signaler ce lien ?",
      message: "Utilise le signalement pour un lien d'arnaque, de virus ou de contenu illégal. Après plusieurs signalements, le lien est désactivé automatiquement.",
      input: { label: "Motif (facultatif)", placeholder: "ex. faux site de banque" },
      confirm: "Envoyer le signalement",
      danger: true,
    });
    if (reason === null) return;
    $("report").disabled = true;
    try {
      const res = await fetch("/api/report", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, reason }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || "Signalement impossible pour le moment.");
      setLabel($("report"), "check", "Signalement envoyé");
      toast("Merci, ton signalement a été enregistré.");
    } catch (e) {
      $("report").disabled = false;
      toast(e instanceof TypeError ? "Serveur injoignable, réessaie." : e.message, "err");
    }
  });
</script>
</body>
</html>

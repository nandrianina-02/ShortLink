<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Statistiques · shortlink</title>
<link rel="stylesheet" href="/style.css">
<script src="/icons.js"></script>
<script src="/ui.js"></script>
<script src="/qr-modal.js"></script>
</head>
<body>
<main>
  <header class="topbar">
    <a class="brand" href="/">short<span>link</span></a>
    <a class="back" href="/"><i data-i="arrow-left"></i>Mes liens</a>
  </header>

  <h1 id="title" class="title-mono">Statistiques</h1>
  <p id="dest" class="muted dest-line"></p>
  <p id="error" class="card notice" role="alert" hidden></p>

  <div id="content" hidden>
    <div class="row" style="margin-top:16px">
      <button id="copyBtn" type="button" class="ghost"><i data-i="copy"></i>Copier le lien</button>
      <button id="qrBtn" type="button" class="ghost"><i data-i="qr-code"></i>QR code</button>
      <a id="preview" class="btn" href="#"><i data-i="eye"></i>Page d'aperçu</a>
    </div>

    <div class="kpis">
      <div class="kpi"><b id="k-total">0</b><span>vues au total</span></div>
      <div class="kpi"><b id="k-uniq">0</b><span>visiteurs uniques</span></div>
      <div class="kpi"><b id="k-24h">0</b><span>dernières 24 h</span></div>
      <div class="kpi"><b id="k-7d">0</b><span>7 derniers jours</span></div>
    </div>

    <section class="card">
      <h2>Vues par jour, sur 30 jours</h2>
      <div id="chart"></div>
    </section>

    <div class="cols">
      <section class="card"><h2>Sources</h2><div id="b-referrers" class="bars"></div></section>
      <section class="card"><h2>Pays</h2><div id="b-countries" class="bars"></div></section>
      <section class="card"><h2>Appareils</h2><div id="b-devices" class="bars"></div></section>
      <section class="card"><h2>Navigateurs</h2><div id="b-browsers" class="bars"></div></section>
      <section class="card"><h2>Systèmes</h2><div id="b-os" class="bars"></div></section>
      <section class="card"><h2>À propos</h2><p id="info" class="muted small" style="margin:0"></p></section>
    </div>

    <section class="card">
      <h2>Dernières visites</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Date</th><th>Source</th><th>Pays</th><th>Appareil</th><th>Navigateur</th><th>Système</th></tr></thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
      <p id="noRecent" class="muted" hidden>Aucune visite pour l'instant.</p>
    </section>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const code = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  function ownerToken() { try { return localStorage.getItem("owner") || ""; } catch { return ""; } }
  const fmt = (d) => new Date(d).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
  const fmtDay = (s) => new Date(s + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });

  function bars(id, rows) {
    const box = $(id);
    box.replaceChildren();
    if (!rows.length) { box.textContent = "Pas encore de données."; box.className = "muted small"; return; }
    box.className = "bars";
    const max = Math.max(...rows.map((r) => r.count));
    for (const r of rows) {
      const line = document.createElement("div"); line.className = "bar";
      const l = document.createElement("span"); l.textContent = l.title = r.label;
      const track = document.createElement("div");
      const fill = document.createElement("i"); fill.style.width = Math.max(3, (r.count / max) * 100) + "%";
      track.append(fill);
      const n = document.createElement("em"); n.textContent = r.count;
      line.append(l, track, n);
      box.append(line);
    }
  }

  // Les libellés sont en HTML sous le graphique : dans le SVG, ils deviendraient illisibles une fois réduits sur mobile.
  function chart(daily) {
    const W = 300, H = 100, bw = W / daily.length;
    const max = Math.max(1, ...daily.map((d) => d.count));
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Vues par jour sur 30 jours, maximum ${max}">`;
    svg += `<line x1="0" y1="${H - .5}" x2="${W}" y2="${H - .5}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    daily.forEach((d, i) => {
      const h = d.count ? Math.max(2, (d.count / max) * (H - 4)) : 0;
      svg += `<rect style="--i:${i}" x="${i * bw + bw * .15}" y="${H - h}" width="${bw * .7}" height="${h}"><title>${d.date} : ${d.count} vue(s)</title></rect>`;
    });
    svg += `</svg><div class="chart-axis"><span>${fmtDay(daily[0].date)}</span><span>max ${max} / jour</span><span>${fmtDay(daily[daily.length - 1].date)}</span></div>`;
    $("chart").innerHTML = svg; // uniquement des nombres et dates générés par le serveur
  }

  let shortUrl = "";
  $("copyBtn").onclick = async () => {
    const btn = $("copyBtn"), old = btn.innerHTML;
    try { await copyText(shortUrl); } catch { toast("Copie impossible sur ce navigateur.", "err"); return; }
    setLabel(btn, "check", "Copié");
    btn.classList.add("ic-pop");
    setTimeout(() => { btn.innerHTML = old; btn.classList.remove("ic-pop"); }, 1500);
  };

  async function load() {
    try {
      let res;
      try { res = await fetch("/api/stats/" + encodeURIComponent(code), { headers: { "x-owner": ownerToken() } }); }
      catch { throw new Error("Serveur injoignable. Vérifie ta connexion."); }
      const s = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(s.error || "Impossible de charger les statistiques.");
      shortUrl = s.shortUrl;
      $("title").textContent = s.shortUrl.replace(/^https?:\/\//, "");
      document.title = $("title").textContent + " · statistiques";
      $("dest").innerHTML = icon("arrow-right");
      const dt = document.createElement("span"); dt.textContent = s.url; $("dest").append(dt);
      countTo($("k-total"), s.total);
      countTo($("k-uniq"), s.uniques);
      countTo($("k-24h"), s.last24h);
      countTo($("k-7d"), s.last7d);
      $("qrBtn").onclick = () => openQr(s.code, s.shortUrl);
      $("preview").href = "/p/" + encodeURIComponent(s.code);
      chart(s.daily);
      bars("b-referrers", s.referrers); bars("b-countries", s.countries);
      bars("b-devices", s.devices); bars("b-browsers", s.browsers); bars("b-os", s.os);
      $("info").textContent = `Créé le ${fmt(s.createdAt)}` +
        (s.expiresAt ? `, expire le ${fmt(s.expiresAt)}.` : ", sans date d'expiration.") +
        " Les robots et les aperçus de liens (WhatsApp, Facebook…) ne sont pas comptés." +
        (s.disabled ? " Ce lien est désactivé." : "");
      const tb = $("recent"); tb.replaceChildren();
      $("noRecent").hidden = s.recent.length > 0;
      tb.closest(".scroll").hidden = !s.recent.length;
      for (const r of s.recent) {
        const tr = document.createElement("tr");
        [fmt(r.at), r.referrer, r.country, r.device, r.browser, r.os].forEach((v) => {
          const td = document.createElement("td"); td.textContent = v || "—"; tr.append(td);
        });
        tb.append(tr);
      }
      // Les graphiques ne s'animent qu'au premier affichage, pas à chaque rafraîchissement
      $("content").classList.toggle("grow", $("content").hidden);
      $("content").hidden = false;
      $("error").hidden = true;
    } catch (e) {
      // Une erreur pendant un rafraîchissement ne doit pas effacer des stats déjà affichées
      if (!$("content").hidden) return;
      $("title").textContent = "Statistiques indisponibles";
      $("error").textContent = e.message;
      $("error").hidden = false;
    }
  }
  load();
  setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>
